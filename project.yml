name: CONCEarth
options:
  bundleIdPrefix: com.concearth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CONCEarth:
    type: application
    platform: iOS
    sources:
      - path: CONCEarth
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.concearth.app
        INFOPLIST_FILE: CONCEarth/Info.plist
        CODE_SIGN_ENTITLEMENTS: CONCEarth/CONCEarth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    dependencies:
      - target: CONCEarthWidget
        embed: true
    info:
      path: CONCEarth/Info.plist
      properties:
        CFBundleDisplayName: CONC EARTH
        CFBundleName: CONCEarth
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: CONC EARTH uses your location to suggest a nearby home airport for your focus flights.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
  CONCEarthWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CONCEarthWidget
      - path: CONCEarth/LiveActivity/FocusFlightAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.concearth.app.widget
        INFOPLIST_FILE: CONCEarthWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CONCEarthWidget/CONCEarthWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    info:
      path: CONCEarthWidget/Info.plist
      properties:
        CFBundleDisplayName: CONC EARTH
        CFBundleName: CONCEarthWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  CONCEarth:
    build:
      targets:
        CONCEarth: all
        CONCEarthWidget: all
    run:
      config: Debug
    archive:
      config: Release
