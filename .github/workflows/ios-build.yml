name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CONC EARTH
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer Xcode 16+: current Homebrew XcodeGen may emit project format 77.
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app \
            /Applications/Xcode_15.4.app
          do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              echo "Selected $candidate"
              break
            fi
          done

      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages / list schemes
        run: |
          xcodebuild -list -project CONCEarth.xcodeproj

      - name: Build (unsigned compile verification)
        run: |
          xcodebuild \
            -project CONCEarth.xcodeproj \
            -scheme CONCEarth \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Detect signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$KEYCHAIN_PASSWORD" ] && [ -n "$DEVELOPMENT_TEAM" ]; then
            echo "ipa_possible=true" >> "$GITHUB_OUTPUT"
          else
            echo "ipa_possible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive & export IPA (signed, optional)
        id: archive
        if: steps.signing.outputs.ipa_possible == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          BUNDLE_ID: com.concearth.app
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

          mkdir -p build/ipa
          xcodebuild \
            -project CONCEarth.xcodeproj \
            -scheme CONCEarth \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CONCEarth.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            archive

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/CONCEarth.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

          echo "ipa_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        if: steps.archive.outputs.ipa_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CONCEarth-IPA
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned app binary (debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONCEarth-Release-Product
          path: build/DerivedData/Build/Products/Release-iphoneos/CONCEarth.app
          if-no-files-found: ignore
          retention-days: 7

      - name: Signing status notice
        if: steps.archive.outputs.ipa_ready != 'true'
        run: |
          echo "::notice::Compile build succeeded. IPA export skipped because Apple signing secrets are not configured. See Docs/SIGNING_AND_IPA.md"
